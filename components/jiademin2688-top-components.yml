description: >-
  AI City's one embeddable client-side component: a script-tag widget (embed.js, HTTP 200, application/javascript,
  4,929 bytes, version string 1.0.0 inside the file) that renders a live window onto the 3D town inside any web
  page, sized and themed through an init() options object or data- attributes. It is a UI surface for humans,
  distinct from the A2A API, and it is CDN-less - served straight from the product host, unversioned in the URL.
docs:
- https://aicity.jiademin2688.top/embed-guide.html
